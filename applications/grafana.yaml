---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: 14.1.0
      helm:
        valuesObject:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          persistence:
            enabled: false
          sidecar:
            datasources:
              enabled: true
              label: grafana_datasource
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: ca
            hosts:
              - grafana.20.82.52.99.nip.io
            tls:
              - secretName: grafana-tls
                hosts:
                  - grafana.20.82.52.99.nip.io
    - repoURL: https://github.com/ororck/tp-gitops-manifests.git
      targetRevision: main
      path: components/grafana-datasource
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
